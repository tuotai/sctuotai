        const newsIds = Object.keys(newsItems);

        const activities = newsIds.filter(id => newsItems[id].category === '业务活动');
        const honors = newsIds.filter(id => newsItems[id].category === '拓泰荣誉');
        const research = newsIds.filter(id => newsItems[id].category === '拓泰研究');
        const culture = newsIds.filter(id => newsItems[id].category === '拓泰人文');

        const displayLimit = 8;

        function renderList(containerId, items, categoryKey) {
            const container = document.getElementById(containerId);
            const visibleItems = items.slice(0, displayLimit);
            const hasMore = items.length > displayLimit;

            container.innerHTML = visibleItems.map(id => {
                const item = newsItems[id];
                return `
                    <a href="${item.wechatUrl}" target="_blank" class="flex items-start space-x-3 p-3 bg-gray-50 hover:bg-gray-100 rounded-lg transition-colors cursor-pointer group">
                        <div class="w-16 h-16 flex-shrink-0 rounded-lg overflow-hidden">
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-medium text-gray-800 group-hover:text-primary truncate">${item.title}</h4>
                            <p class="text-sm text-gray-500 mt-1">${item.date}</p>
                        </div>
                        <i class="fa fa-external-link text-gray-400 group-hover:text-primary transition-colors flex-shrink-0 mt-2"></i>
                    </a>
                `;
            }).join('');

            if (hasMore) {
                container.innerHTML += `
                    <div class="text-center pt-2">
                        <button onclick="loadMore('${categoryKey}', '${containerId}', ${displayLimit})" class="text-primary hover:text-primary/80 text-sm font-medium cursor-pointer">
                            查看更多 <i class="fa fa-chevron-down ml-1"></i>
                        </button>
                    </div>
                `;
            }
        }

        window.currentPage = {
            'activities': 1,
            'honors': 1,
            'research': 1,
            'culture': 1
        };

        window.loadMore = function(categoryKey, containerId, displayLimit) {
            const categoryItems = categoryKey === 'activities' ? activities :
                                  categoryKey === 'honors' ? honors :
                                  categoryKey === 'research' ? research : culture;

            const container = document.getElementById(containerId);
            window.currentPage[categoryKey]++;
            const currentPage = window.currentPage[categoryKey];
            const startIndex = (currentPage - 1) * displayLimit;
            const endIndex = startIndex + displayLimit;
            const newItems = categoryItems.slice(startIndex, endIndex);

            let itemsHtml = '';
            const itemsToShow = categoryItems.slice(0, endIndex);
            itemsToShow.forEach(id => {
                const item = newsItems[id];
                itemsHtml += `
                    <a href="${item.wechatUrl}" target="_blank" class="flex items-start space-x-3 p-3 bg-gray-50 hover:bg-gray-100 rounded-lg transition-colors cursor-pointer group">
                        <div class="w-16 h-16 flex-shrink-0 rounded-lg overflow-hidden">
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-medium text-gray-800 group-hover:text-primary truncate">${item.title}</h4>
                            <p class="text-sm text-gray-500 mt-1">${item.date}</p>
                        </div>
                        <i class="fa fa-external-link text-gray-400 group-hover:text-primary transition-colors flex-shrink-0 mt-2"></i>
                    </a>
                `;
            });

            const btnHtml = endIndex < categoryItems.length ? `
                <div class="text-center pt-2">
                    <button onclick="loadMore('${categoryKey}', '${containerId}', ${displayLimit})" class="text-primary hover:text-primary/80 text-sm font-medium cursor-pointer">
                        查看更多 <i class="fa fa-chevron-down ml-1"></i>
                    </button>
                </div>
            ` : `
                <div class="text-center pt-2">
                    <button onclick="showLess('${categoryKey}', '${containerId}', ${displayLimit})" class="text-gray-500 hover:text-gray-700 text-sm font-medium cursor-pointer">
                        收起 <i class="fa fa-chevron-up ml-1"></i>
                    </button>
                </div>
            `;

            container.innerHTML = itemsHtml + btnHtml;
        };

        window.showLess = function(categoryKey, containerId, displayLimit) {
            window.currentPage[categoryKey] = 1;
            const categoryItems = categoryKey === 'activities' ? activities :
                                  categoryKey === 'honors' ? honors :
                                  categoryKey === 'research' ? research : culture;
            renderList(containerId, categoryItems, categoryKey);
        };

        renderList('news-activities', activities, 'activities');
        renderList('news-honors', honors, 'honors');
        renderList('news-research', research, 'research');
        renderList('news-culture', culture, 'culture');
    </script>
