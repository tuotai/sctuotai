        const activityIds = Object.keys(partyActivities);

        function getActivityIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('activity') || 'theme-day';
        }

        function loadActivityDetail() {
            const activityId = getActivityIdFromUrl();
            const activity = partyActivities[activityId];

            if (!activity) {
                document.getElementById('activity-title').textContent = '活动未找到';
                return;
            }

            document.getElementById('activity-date').innerHTML = `<i class="fa fa-calendar mr-1"></i>${activity.date}`;
            document.getElementById('activity-title').textContent = activity.title;
            document.getElementById('activity-image').innerHTML = `<img src="${activity.image}" alt="${activity.title}" class="w-full h-64 md:h-80 object-cover">`;
            document.getElementById('activity-content').innerHTML = `
                <p class="text-gray-600 leading-relaxed mb-6 font-medium">${activity.summary}</p>
                ${activity.content}
            `;
            document.title = activity.title + ' - 拓泰党建 - 四川拓泰律师事务所';

            const relatedGrid = document.getElementById('related-grid');
            const otherActivities = activityIds.filter(id => id !== activityId).slice(0, 3);
            
            relatedGrid.innerHTML = otherActivities.map(id => {
                const a = partyActivities[id];
                return `
                    <a href="party-building-detail.html?activity=${id}" class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 border border-gray-100 hover:border-red-500/30 overflow-hidden block">
                        <div class="h-32 bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center">
                            <i class="fa ${a.icon} text-4xl text-white"></i>
                        </div>
                        <div class="p-4">
                            <span class="text-xs text-red-600 font-medium"><i class="fa fa-calendar mr-1"></i>${a.date}</span>
                            <h3 class="text-base font-bold text-gray-800 mt-2">${a.title}</h3>
                        </div>
                    </a>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', loadActivityDetail);
    </script>
</body>
