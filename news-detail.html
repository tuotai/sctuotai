        const newsIds = Object.keys(newsItems);

        function getNewsIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('news') || 'seminar-2025';
        }

        function loadNewsDetail() {
            const newsId = getNewsIdFromUrl();
            const news = newsItems[newsId];

            if (!news) {
                document.getElementById('news-title').textContent = '资讯未找到';
                return;
            }

            document.getElementById('news-category').textContent = news.category;
            document.getElementById('news-date').textContent = news.date;
            document.getElementById('news-title').textContent = news.title;
            document.getElementById('news-image').innerHTML = `<img src="${news.image}" alt="${news.title}" class="w-full h-64 md:h-80 object-cover">`;
            document.getElementById('news-content').innerHTML = `
                <p class="text-gray-600 leading-relaxed mb-6 font-medium" style="text-indent: 2em;">${news.summary}</p>
                <div class="bg-red-50 border border-red-200 rounded-xl p-6 text-center">
                    <i class="fa fa-link text-red-500 text-4xl mb-4"></i>
                    <p class="text-gray-700 mb-4">查看完整内容，请点击下方按钮跳转到微信公众号文章</p>
                    <a href="${news.wechatUrl}" target="_blank" class="inline-flex items-center space-x-2 bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg transition-colors">
                        <i class="fa fa-external-link"></i>
                        <span>阅读原文</span>
                    </a>
                </div>
            `;
            document.title = news.title + ' - 四川拓泰律师事务所';

            const relatedGrid = document.getElementById('related-grid');
            const otherNews = newsIds.filter(id => id !== newsId).slice(0, 3);
            
            relatedGrid.innerHTML = otherNews.map(id => {
                const n = newsItems[id];
                return `
                    <a href="news-detail.html?news=${id}" class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 border border-gray-100 hover:border-primary/30 overflow-hidden block">
                        <img src="${n.image}" alt="${n.title}" class="w-full h-32 object-cover">
                        <div class="p-4">
                            <span class="text-xs text-primary font-medium px-2 py-1 bg-primary/10 rounded">${n.category}</span>
                            <h3 class="text-base font-bold text-gray-800 mt-2 line-clamp-2">${n.title}</h3>
                            <p class="text-sm text-gray-500 mt-2">${n.date}</p>
                        </div>
                    </a>
                `;
            }).join('');
        }'your-new-article-id': {
