                    <h3 class="text-xl font-bold mb-4 mt-8">服务范围</h3>
                    <ul class="space-y-3 text-gray-600">
                        <li class="flex items-start"><i class="fa fa-check text-primary mt-1 mr-3"></i>文旅项目开发咨询</li>
                        <li class="flex items-start"><i class="fa fa-check text-primary mt-1 mr-3"></i>景区运营合规管理</li>
                        <li class="flex items-start"><i class="fa fa-check text-primary mt-1 mr-3"></i>文化产业投资并购</li>
                        <li class="flex items-start"><i class="fa fa-check text-primary mt-1 mr-3"></i>旅游合同纠纷处理</li>
                        <li class="flex items-start"><i class="fa fa-check text-primary mt-1 mr-3"></i>文化遗产保护法律服务</li>
                        <li class="flex items-start"><i class="fa fa-check text-primary mt-1 mr-3"></i>文旅企业常年法律顾问</li>
                    </ul>
                `
            }
        };

        const serviceIds = {
            'administrative-law': '行政法律',
            'corporate-business': '公司业务',
            'state-owned-assets': '国资国企',
            'compliance-internal-control': '合规内控',
            'investment-ma': '投资并购',
            'financial-securities': '金融证券',
            'intellectual-property': '知识产权',
            'construction-engineering': '建设工程',
            'execution-restructuring': '执行重组',
            'financial-tax': '财务税收',
            'criminal-defense': '刑事辩护',
            'cultural-tourism': '文化旅游'
        };

        const serviceIdKeys = Object.keys(services);

        function getServiceIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('service') || 'administrative-law';
        }

        function loadServiceDetail() {
            const serviceId = getServiceIdFromUrl();
            const service = services[serviceId];

            if (!service) {
                document.getElementById('service-title').textContent = '服务未找到';
                return;
            }

            document.getElementById('service-icon').innerHTML = `<i class="fa ${service.icon} text-4xl text-primary"></i>`;
            document.getElementById('service-title').textContent = service.title;
            document.getElementById('service-subtitle').textContent = service.subtitle;
            document.getElementById('service-content').innerHTML = service.content;
            document.title = service.title + ' - 四川拓泰律师事务所';

            const relatedGrid = document.getElementById('related-grid');
            const otherServices = serviceIdKeys.filter(id => id !== serviceId).slice(0, 3);
            
            relatedGrid.innerHTML = otherServices.map(id => {
                const s = services[id];
                return `
                    <a href="service-detail.html?service=${id}" class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 border border-gray-100 hover:border-primary/30 p-6 block">
                        <div class="w-12 h-12 bg-gradient-to-br from-primary/20 to-primary/5 rounded-xl flex items-center justify-center mb-4">
                            <i class="fa ${s.icon} text-xl text-primary"></i>
                        </div>
                        <h3 class="text-lg font-bold text-gray-800 mb-2">${s.title}</h3>
                        <p class="text-sm text-gray-600 leading-relaxed line-clamp-2">${s.subtitle}</p>
                    </a>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', loadServiceDetail);
    </script>
</body>
