                expertise: ['法律风险识别', '风险等级评估', '风险防控方案', '风险预警机制', '风险应对策略'],
                cases: [
                    '为某上市公司进行法律风险全面评估',
                    '为某重大并购项目提供法律风险评估报告',
                    '代理某企业建立法律风险预警系统'
                ],
                keywords: '风险评估'
            },
            '国际贸易': {
                expertise: ['国际贸易合同', '进出口合规', '贸易救济措施', '跨境电商法律', '国际贸易纠纷'],
                cases: [
                    '为某外贸企业提供全程法律服务',
                    '代理某企业应对美国337调查',
                    '为某跨境电商平台提供法律合规服务'
                ],
                keywords: '国际贸易'
            },
            '跨境投资': {
                expertise: ['境外投资备案', '跨境并购法律', '返程投资架构', '外汇合规管理', '跨境税务筹划'],
                cases: [
                    '为某企业境外投资提供全程法律服务',
                    '代理某外资企业返程投资架构设计',
                    '为某上市公司跨境并购提供法律服务'
                ],
                keywords: '跨境投资'
            },
            '涉外法律': {
                expertise: ['涉外合同审查', '外资企业法律服务', '涉外婚姻继承', '涉外知识产权', '涉外诉讼代理'],
                cases: [
                    '为某外资企业提供常年法律顾问服务',
                    '代理某涉外货物买卖合同纠纷',
                    '为某涉外婚姻家庭提供法律服务'
                ],
                keywords: '涉外法律'
            }
        };

        for (let i = 0; i < 80; i++) {
            const lastName = lastNames[i % lastNames.length];
            const firstName = firstNames[i % firstNames.length];
            const name = lastName + firstName;
            const title = titles[i % titles.length];
            const school = schools[i % schools.length];
            const specialtyKeys = Object.keys(specialtyData);
            const mainSpecialty = specialtyKeys[i % specialtyKeys.length];
            const specialty = specialtyData[mainSpecialty];
            const years = 5 + (i % 20);
            const seed = 1000 + i;
            
            lawyers['lawyer-' + (i + 1)] = {
                name: name,
                title: title,
                image: `https://picsum.photos/seed/${seed}/400/500`,
                tags: specialty.expertise.slice(0, 3),
                intro: `${name}律师，四川拓泰律师事务所${title}。毕业于${school}，从业${years}年以上，在${mainSpecialty}领域具有丰富的实践经验。长期为各类企业提供专业、高效的法律服务。`,
                email: `${name.toLowerCase()}@tuotai-law.com`,
                phone: `028-${String(10000000 + i).substring(0, 8)}`,
                expertise: specialty.expertise,
                experience: [
                    `${2010 + (i % 10)}年-至今：四川拓泰律师事务所${title}`,
                    `${2008 + (i % 8)}年-${2010 + (i % 10)}年：${school}法学院讲师`,
                    `${2005 + (i % 5)}年-${2008 + (i % 8)}年：某${['知名', '大型', '专业'][i % 3]}律所律师`
                ],
                cases: specialty.cases,
                awards: [
                    `${2020 + (i % 5)}年：${['年度优秀律师', '省级优秀律师', '优秀法律顾问', '业务标兵', '最佳服务奖'][i % 5]}`,
                    `${2018 + (i % 5)}年：${['优秀党员律师', '先进工作者', '优秀代理人', '最佳进步奖', '专业之星'][i % 5]}`
                ]
            };
        }

        lawyers['lawyer-2'] = {
            name: '吴苛政',
            title: '主任 / 党支部书记 / 高级合伙人 ',
            image: 'images/吴苛政.jpg',
            tags: ['争议解决', '公司治理', '合规风控'],
            intro: '吴苛政律师，中共党员，西南财经大学法学学士、法律硕士，四川省优秀律师，四川省公司法专业律师。吴苛政律师先后工作于成都市青羊区房产管理局、成都市锦江区人民法院，现为四川拓泰律师事务所党支部书记、主任、高级合伙人。',
            email: 'wukezheng@tuotai-law.com',
            phone: '028-86269888',
            expertise: ['争议解决', '公司治理', '合规风控', '并购重组', '投资融资', '环境与资源'],
            experience: [
                '四川省律师协会装备制造专业委员会副主任',
                '成都市律师协会律师执业考核专门委员会副主任',
                '成都市律师协会公司法专业委员会副主任',
                '成都市律师协会青羊工作委员会副主任',
                '成都市律师协会理事'
            ],
            cases: [
                '西南交通大学法律硕士研究生校外导师',
                '西南财经大学地方法治研究所研究员',
                '成都大学法律硕士研究生校外导师',
                '四川警察学院法学专业校外导师'
            ],
            awards: [
                '四川省优秀律师',
                '成都市优秀律师',
                '成都市青羊区优秀律师',
                '美姑县人民政府法律顾问先进个人'
            ]
        };

        const lawyerIds = Object.keys(lawyers);

        function getLawyerIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('lawyer') || 'lawyer-1';
        }

        function loadLawyerDetail() {
            const lawyerId = getLawyerIdFromUrl();
            const lawyer = lawyers[lawyerId];

            if (!lawyer) {
                document.getElementById('lawyer-name').textContent = '律师未找到';
                return;
            }

            document.getElementById('lawyer-image').src = lawyer.image;
            document.getElementById('lawyer-image').alt = lawyer.name;
            document.getElementById('lawyer-name').textContent = lawyer.name;
            document.getElementById('lawyer-title').textContent = lawyer.title;
            document.getElementById('lawyer-intro').textContent = lawyer.intro;
            document.title = lawyer.name + ' - 四川拓泰律师事务所';

            const isWuKezheng = (lawyerId === 'lawyer-2');
            
            const tagsContainer = document.getElementById('lawyer-tags');
            if (isWuKezheng) {
                tagsContainer.innerHTML = '';
            } else {
                tagsContainer.innerHTML = lawyer.tags.map(tag => 
                    `<span class="px-3 py-1 bg-primary/10 text-primary text-sm rounded-full">${tag}</span>`
                ).join('');
            }

            if (isWuKezheng) {
                document.getElementById('lawyer-intro').style.textIndent = '2em';
            }

            document.getElementById('lawyer-email').value = lawyer.email;
            document.getElementById('lawyer-phone').value = lawyer.phone;

            const expertiseContainer = document.getElementById('lawyer-expertise');
            expertiseContainer.innerHTML = lawyer.expertise.map(item => `
                <div class="flex items-center space-x-2">
                    <i class="fa fa-check-circle text-primary"></i>
                    <span class="text-gray-700">${item}</span>
                </div>
            `).join('');

            const experienceContainer = document.getElementById('lawyer-experience');
            experienceContainer.innerHTML = lawyer.experience.map(item => `
                <div class="flex items-start space-x-3">
                    <i class="fa fa-briefcase text-primary mt-1"></i>
                    <span class="text-gray-600">${item}</span>
                </div>
            `).join('');

            if (isWuKezheng) {
                document.getElementById('experience-title').textContent = '律协任职';
            }

            const casesContainer = document.getElementById('lawyer-cases');
            casesContainer.innerHTML = lawyer.cases.map(item => `
                <div class="flex items-start space-x-3">
                    <i class="fa fa-gavel text-primary mt-1"></i>
                    <span class="text-gray-600">${item}</span>
                </div>
            `).join('');

            if (isWuKezheng) {
                document.getElementById('cases-title').textContent = '社会职务';
            }

            const awardsContainer = document.getElementById('lawyer-awards');
            awardsContainer.innerHTML = lawyer.awards.map(item => `
                <div class="flex items-start space-x-3">
                    <i class="fa fa-trophy text-yellow-500 mt-1"></i>
                    <span class="text-gray-600">${item}</span>
                </div>
            `).join('');

            const relatedGrid = document.getElementById('related-grid');
            const currentIndex = lawyerIds.indexOf(lawyerId);
            const otherLawyers = [];
            
            for (let i = 1; i <= 3; i++) {
                const nextIndex = (currentIndex + i) % lawyerIds.length;
                otherLawyers.push(lawyerIds[nextIndex]);
            }
            
            relatedGrid.innerHTML = otherLawyers.map(id => {
                const l = lawyers[id];
                return `
                    <a href="lawyer-detail.html?lawyer=${id}" class="bg-white rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 border border-gray-100 hover:border-primary/30 overflow-hidden block">
                        <div class="h-48 overflow-hidden">
                            <img src="${l.image}" alt="${l.name}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-4">
                            <h3 class="text-lg font-bold text-gray-800">${l.name}</h3>
                            <p class="text-primary text-sm mt-1">${l.title}</p>
                        </div>
                    </a>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', loadLawyerDetail);
    </script>
</body>
</html>
